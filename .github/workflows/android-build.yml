name: Android build
on:
  push:
    branches: [main, codex/complete-offline-app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build debug and unsigned release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
